name: Dependabot auto-merge (fixed, GRAPHQL-3251)
description: Toggles auto-merge on dependabot PRs, using dependency-group as a fallback when update-type is null

inputs:
  github-token:
    description: github token from the caller repository

runs:
  using: composite
  steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a
        with:
          github-token: '${{ inputs.github-token }}'

      - name: Dump all outputs
        shell: bash
        run: |
          cat <<'JSON'
          ${{ toJSON(steps.metadata.outputs) }}
          JSON

      - name: Enable auto-merge for Dependabot PRs
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.dependency-group == 'security-patch-minor'
        shell: bash
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{inputs.github-token}}
